<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mobile Preview - Certificate</title>
  <style>
    body {
      background: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
      font-family: sans-serif;
    }
    .phone-frame {
      width: 375px;
      height: 812px;
      background: #000;
      border-radius: 40px;
      padding: 20px 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 30px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    h2 {
      color: #fff;
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div>
    <h2>📱 Mobile Preview (iPhone)</h2>
    <div class="phone-frame">
      <div class="phone-screen">
        <iframe src="PREVIEW_FINAL.html"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
